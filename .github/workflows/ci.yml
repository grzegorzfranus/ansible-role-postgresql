---
name: "CI"

run-name: "CI: ${{ github.event.pull_request.title || github.ref_name }} by @${{ github.actor }}"

'on':
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ================================================================
  # 1. BRANCH NAME VALIDATION (Pre-hook)
  # ----------------------------------------------------------------
  # Validates that feature branch names follow standard prefixes
  # to maintain git hygiene across the repository.
  # ================================================================
  branch-name-lint:
    name: "🔍 Validate Branch Naming"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "🔍 Validate branch name"
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Skipping branch name validation for non-pull request event." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REGEX='^(feature|bugfix|fix|hotfix|release|chore|docs|refactor|test|build|ci|perf|revert)/[a-zA-Z0-9-]+$|^release-please--.*$|^dependabot/.+$'
          if [[ ! "$BRANCH_NAME" =~ $REGEX ]]; then
            {
              echo "### ❌ Branch Name Validation Failed"
              echo ""
              echo "Branch name \`$BRANCH_NAME\` does not match required pattern."
              echo ""
              echo "**Allowed branch prefixes:**"
              echo "- \`feature/\`, \`bugfix/\`, \`fix/\`, \`hotfix/\`, \`release/\`, \`chore/\`, \`docs/\`, \`refactor/\`, \`test/\`, \`build/\`, \`ci/\`, \`perf/\`, \`revert/\`"
              echo ""
              echo "**Example valid branch name:**"
              echo "\`refactor/align-with-ansible-standards\`"
              echo ""
              echo "Rename your branch using:"
              echo "\`\`\`bash"
              echo "git branch -m <new-branch-name>"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Branch name '$BRANCH_NAME' does not match regex: $REGEX"
            exit 1
          fi
          echo "### ✅ Branch Name Validation Passed" >> "$GITHUB_STEP_SUMMARY"

  # ================================================================
  # 2. PR TITLE VALIDATION (Pre-hook)
  # ----------------------------------------------------------------
  # Enforces Conventional Commits syntax on Pull Request titles
  # for automated release notes and changelog generation.
  # ================================================================
  pr-title-lint:
    name: "🔍 Validate PR Title Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "🔍 Validate PR title"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Skipping PR title validation for non-pull request event." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REGEX='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .+$'
          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            {
              echo "### ❌ PR Title Validation Failed"
              echo ""
              echo "PR title \`$PR_TITLE\` does not match Conventional Commits format."
              echo ""
              echo "**Allowed types:**"
              echo "- \`feat\`, \`fix\`, \`docs\`, \`style\`, \`refactor\`, \`perf\`, \`test\`, \`build\`, \`ci\`, \`chore\`, \`revert\`"
              echo ""
              echo "**Example valid title:**"
              echo "\`refactor: align role with Ansible standards and reference configuration\`"
              echo ""
              echo "Update the PR title in GitHub UI or via gh CLI."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PR title '$PR_TITLE' does not match Conventional Commits format: $REGEX"
            exit 1
          fi
          echo "### ✅ PR Title Validation Passed" >> "$GITHUB_STEP_SUMMARY"

  # ================================================================
  # 3. ANSIBLE ROLE TESTING PIPELINE
  # ----------------------------------------------------------------
  # Runs yamllint, ansible-lint, metadata verification, security
  # scanning, and Molecule integration tests across supported OS distributions.
  # ================================================================
  ci:
    needs: [branch-name-lint, pr-title-lint]
    uses: grzegorzfranus/github-workflows/.github/workflows/ansible-ci.yml@main
    with:
      molecule-distros: '["ubuntu2604", "ubuntu2404", "debian13"]'
      molecule-scenarios: '["default"]'

  # ================================================================
  # 4. MERGE CHECK GATE
  # ----------------------------------------------------------------
  # Aggregates test results across all workflow jobs to serve as
  # the single required status check for branch protection rules.
  # ================================================================
  merge-check:
    name: "Merge Check Gate"
    needs: [branch-name-lint, pr-title-lint, ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "⚙️ Evaluate results"
        env:
          BRANCH_NAME_LINT_RESULT: ${{ needs.branch-name-lint.result }}
          PR_TITLE_LINT_RESULT: ${{ needs.pr-title-lint.result }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          echo "Branch name lint: $BRANCH_NAME_LINT_RESULT"
          echo "PR title lint: $PR_TITLE_LINT_RESULT"
          echo "CI result: $CI_RESULT"
          has_failures=0
          if [[ "$BRANCH_NAME_LINT_RESULT" == "failure" || "$BRANCH_NAME_LINT_RESULT" == "cancelled" ]]; then
            echo "::error::branch-name-lint failed or was cancelled"
            has_failures=1
          fi
          if [[ "$PR_TITLE_LINT_RESULT" == "failure" || "$PR_TITLE_LINT_RESULT" == "cancelled" ]]; then
            echo "::error::pr-title-lint failed or was cancelled"
            has_failures=1
          fi
          if [[ "$CI_RESULT" == "failure" || "$CI_RESULT" == "cancelled" ]]; then
            echo "::error::ci failed or was cancelled"
            has_failures=1
          fi
          if [[ "$has_failures" -eq 1 ]]; then
            exit 1
          fi
          echo "All checks passed"
