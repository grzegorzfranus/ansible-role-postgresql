---
# ==============================================================================
# PostgreSQL Input Assertion Validation
# ==============================================================================

- name: "PostgreSQL | assert | Validate role action option"
  ansible.builtin.assert:
    that:
      - postgresql_role_action in ['all', 'prerequisites', 'install', 'configure', 'databases', 'upgrade', 'test']
    fail_msg: "Invalid postgresql_role_action '{{ postgresql_role_action }}'. Must be one of: 'all', 'prerequisites', 'install', 'configure', 'databases', 'upgrade', 'test'."
    success_msg: "postgresql_role_action '{{ postgresql_role_action }}' is valid."

- name: "PostgreSQL | assert | Validate config change action option"
  ansible.builtin.assert:
    that:
      - postgresql_config_change_action in ['reload', 'restart']
    fail_msg: "Invalid postgresql_config_change_action '{{ postgresql_config_change_action }}'. Must be 'reload' or 'restart'."
    success_msg: "postgresql_config_change_action '{{ postgresql_config_change_action }}' is valid."

- name: "PostgreSQL | assert | Validate PostgreSQL major version"
  ansible.builtin.assert:
    that:
      - postgresql_version | string in __postgresql_supported_versions
    fail_msg: "Unsupported postgresql_version '{{ postgresql_version }}'. Supported versions are: {{ __postgresql_supported_versions | join(', ') }}."
    success_msg: "postgresql_version '{{ postgresql_version }}' is supported."

- name: "PostgreSQL | assert | Validate network port range"
  ansible.builtin.assert:
    that:
      - postgresql_port | int >= 1
      - postgresql_port | int <= 65535
    fail_msg: "Invalid postgresql_port '{{ postgresql_port }}'. Must be an integer between 1 and 65535."
    success_msg: "postgresql_port {{ postgresql_port }} is within valid range."

- name: "PostgreSQL | assert | Validate max_connections positive integer"
  ansible.builtin.assert:
    that:
      - postgresql_max_connections | int >= 1
    fail_msg: "Invalid postgresql_max_connections '{{ postgresql_max_connections }}'. Must be a positive integer >= 1."
    success_msg: "postgresql_max_connections {{ postgresql_max_connections }} is valid."

- name: "PostgreSQL | assert | Validate parallel worker process counts"
  ansible.builtin.assert:
    that:
      - postgresql_max_worker_processes | int >= 1
      - postgresql_max_parallel_workers_per_gather | int >= 0
      - postgresql_max_parallel_maintenance_workers | int >= 0
      - postgresql_max_parallel_workers | int >= 0
    fail_msg: "Parallel worker process counts must be non-negative integers (max_worker_processes >= 1)."
    success_msg: "Parallel worker process configuration is valid."

- name: "PostgreSQL | assert | Validate query planner storage settings"
  ansible.builtin.assert:
    that:
      - postgresql_random_page_cost | float >= 0.0
      - postgresql_effective_io_concurrency | int >= 0
    fail_msg: "random_page_cost and effective_io_concurrency must be non-negative numeric values."
    success_msg: "Query planner storage settings are valid."

- name: "PostgreSQL | assert | Validate wal_level setting"
  ansible.builtin.assert:
    that:
      - postgresql_wal_level in ['minimal', 'replica', 'logical']
    fail_msg: "Invalid postgresql_wal_level '{{ postgresql_wal_level }}'. Must be 'minimal', 'replica', or 'logical'."
    success_msg: "postgresql_wal_level '{{ postgresql_wal_level }}' is valid."

- name: "PostgreSQL | assert | Validate checkpoint_completion_target range"
  ansible.builtin.assert:
    that:
      - postgresql_checkpoint_completion_target | float >= 0.0
      - postgresql_checkpoint_completion_target | float <= 1.0
    fail_msg: "Invalid postgresql_checkpoint_completion_target '{{ postgresql_checkpoint_completion_target }}'. Must be between 0.0 and 1.0."
    success_msg: "postgresql_checkpoint_completion_target {{ postgresql_checkpoint_completion_target }} is valid."

- name: "PostgreSQL | assert | Validate authentication method"
  ansible.builtin.assert:
    that:
      - postgresql_auth_method in ['scram-sha-256', 'trust', 'reject', 'md5']
    fail_msg: "Invalid postgresql_auth_method '{{ postgresql_auth_method }}'."
    success_msg: "postgresql_auth_method '{{ postgresql_auth_method }}' is valid."

- name: "PostgreSQL | assert | Validate pg_hba entries schema"
  ansible.builtin.assert:
    that:
      - item.type is defined and item.type in ['local', 'host', 'hostssl', 'hostnossl', 'hostgssenc', 'hostnogssenc']
      - item.database is defined
      - item.user is defined
      - item.auth_method is defined
      - (not item.type.startswith('host')) or (item.address is defined and item.address | length > 0)
    fail_msg: "Invalid pg_hba entry {{ item }}. Must define 'type', 'database', 'user', 'auth_method', and 'address' (for host* types)."
    success_msg: "pg_hba entry for user '{{ item.user }}' database '{{ item.database }}' is valid."
  loop: "{{ postgresql_hba_entries }}"
  loop_control:
    label: "{{ item.type | default('unknown') }}:{{ item.user | default('unknown') }}@{{ item.database | default('unknown') }}"

- name: "PostgreSQL | assert | Validate logrotate configuration settings"
  ansible.builtin.assert:
    that:
      - postgresql_logrotate_options is mapping
      - not (postgresql_configure_logrotate | bool) or (postgresql_logging_collector | bool)
      - not (postgresql_configure_logrotate | bool) or
        ((postgresql_log_directory | trim | regex_replace('/+$', '')) != '/var/log/postgresql')
    fail_msg: >-
      postgresql_logrotate_options must be a dict, logrotate requires logging_collector,
      and log_directory cannot resolve to '/var/log/postgresql' (collides with postgresql-common).
    success_msg: "Logrotate configuration settings and requirements are valid."

- name: "PostgreSQL | assert | Validate SSL certificate and key paths"
  ansible.builtin.assert:
    that:
      - not (postgresql_ssl_enabled | bool) or
        (postgresql_ssl_cert_file is defined and
         postgresql_ssl_cert_file | string | length > 0 and
         postgresql_ssl_cert_file.startswith('/'))
      - not (postgresql_ssl_enabled | bool) or
        (postgresql_ssl_key_file is defined and
         postgresql_ssl_key_file | string | length > 0 and
         postgresql_ssl_key_file.startswith('/'))
    fail_msg: >-
      When postgresql_ssl_enabled is true, postgresql_ssl_cert_file and
      postgresql_ssl_key_file must be non-empty absolute path strings.
    success_msg: "SSL certificate and key path configurations are valid."

- name: "PostgreSQL | assert | Validate memory size setting formats"
  ansible.builtin.assert:
    that:
      - postgresql_shared_buffers | string is regex('^[0-9]+(B|kB|MB|GB|TB)?$')
      - postgresql_work_mem | string is regex('^[0-9]+(B|kB|MB|GB|TB)?$')
      - postgresql_maintenance_work_mem | string is regex('^[0-9]+(B|kB|MB|GB|TB)?$')
      - postgresql_effective_cache_size | string is regex('^[0-9]+(B|kB|MB|GB|TB)?$')
      - postgresql_max_wal_size | string is regex('^[0-9]+(B|kB|MB|GB|TB)?$')
      - postgresql_min_wal_size | string is regex('^[0-9]+(B|kB|MB|GB|TB)?$')
    fail_msg: >-
      Memory size variables must be formatted as integers with optional units
      (B, kB, MB, GB, TB) without spaces (e.g., '128MB', '4GB').
    success_msg: "Memory size setting formats are valid."

- name: "PostgreSQL | assert | Validate time setting formats"
  ansible.builtin.assert:
    that:
      - postgresql_checkpoint_timeout | string is regex('^[0-9]+(ms|s|min|h|d)?$')
      - postgresql_log_rotation_age | string is regex('^[0-9]+(ms|s|min|h|d)?$')
    fail_msg: >-
      Time settings must be formatted as integers with optional units
      (ms, s, min, h, d) without spaces (e.g., '15min', '1d').
    success_msg: "Time setting formats are valid."

- name: "PostgreSQL | assert | Validate min_wal_size does not exceed max_wal_size"
  ansible.builtin.assert:
    that:
      - (postgresql_min_wal_size | human_to_bytes | int) <= (postgresql_max_wal_size | human_to_bytes | int)
    fail_msg: "postgresql_min_wal_size cannot exceed postgresql_max_wal_size."
    success_msg: "postgresql_min_wal_size is less than or equal to postgresql_max_wal_size."

- name: "PostgreSQL | assert | Validate postgresql_privs target database specification"
  ansible.builtin.assert:
    that:
      - item.roles is defined
      - item.privs is defined
      - (item.db is defined and item.db | string | length > 0) or
        (item.database is defined and item.database | string | length > 0) or
        (item.name is defined and item.name | string | length > 0)
    fail_msg: "Each postgresql_privs entry must specify 'roles', 'privs', and a target database ('db', 'database', or 'name')."
    success_msg: "postgresql_privs target database specification is valid."
  loop: "{{ postgresql_privs }}"
  loop_control:
    label: "{{ item.roles | default('unknown') }}:{{ item.privs | default('unknown') }}"
